          `;

              btndiv.innerHTML = `<button class="popbtn">Submit Order</button>`;

              document.body.appendChild(div);

              var btnc = document.createElement("div");
              btnc.innerHTML = `<button class="btnclose">Close</button>`
          
              div.appendChild(btnc);
              document.body.appendChild(div);

                div.remove();
              })

               mn.addEventListener("input", function() {
                 this.value = this.value.replace(/[^0-9]/g, "").slice(0,10);
              });

               var number = mn.value

            if(name.trim() == "" || number.trim() == "" || address.trim() == "")
